<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Kōhai CMO — Daily Drafts (internal)</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #0b0e14; color: #d8dee9; font-family: -apple-system, 'SF Pro Text', 'Segoe UI', sans-serif; padding: 36px 20px 80px; }
  .wrap { max-width: 1000px; margin: 0 auto; }
  h1 { font-size: 24px; color: #fff; }
  h1 b { color: #ff9d2e; }
  .sub { color: #8b93a3; font-size: 13px; margin: 6px 0 22px; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 20px; }
  .chip { background: #161d2c; border: 1px solid #232d42; color: #aab3c5; font-size: 12px; padding: 5px 12px; border-radius: 16px; cursor: pointer; }
  .chip.on { background: #ff9d2e; color: #0b0e14; border-color: #ff9d2e; font-weight: 600; }
  .day { margin-bottom: 26px; }
  .date { font-size: 13px; color: #ff9d2e; letter-spacing: 1px; font-weight: 600; margin-bottom: 8px; }
  .cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 10px; }
  .card { background: #121826; border: 1px solid #1e2739; border-radius: 10px; padding: 12px 14px; cursor: pointer; transition: border-color .15s; }
  .card:hover { border-color: #ff9d2e; }
  .card .ch { font-size: 13px; color: #d8dee9; font-weight: 600; text-transform: capitalize; }
  .card .words { font-size: 11px; color: #6d7687; margin-top: 4px; }
  #viewer { display: none; position: fixed; inset: 0; background: rgba(5,8,14,.96); z-index: 10; overflow-y: auto; padding: 40px 20px; }
  #viewer.open { display: block; }
  #viewer .inner { max-width: 860px; margin: 0 auto; background: #121826; border: 1px solid #1e2739; border-radius: 12px; padding: 34px 38px; }
  #viewer h1 { font-size: 20px; margin-bottom: 14px; }
  #viewer h2 { font-size: 15px; margin: 18px 0 8px; color: #ff9d2e; }
  #viewer p, #viewer li { font-size: 14px; line-height: 1.65; margin-bottom: 8px; }
  #viewer table { border-collapse: collapse; margin: 10px 0; width: 100%; }
  #viewer td, #viewer th { border: 1px solid #232d42; padding: 6px 9px; font-size: 12px; }
  #close { position: fixed; top: 14px; right: 18px; font-size: 26px; color: #8b93a3; cursor: pointer; background: none; border: none; }
  .count { color: #5b6474; font-size: 12px; margin-bottom: 14px; }
</style>
</head>
<body>
<div class="wrap">
  <h1>KŌHAI <b>CMO DAILY</b></h1>
  <p class="sub">Daily channel drafts from the CMO loop — <span class="count" id="count"></span> · internal, not for distribution</p>
  <div class="chips" id="chips"></div>
  <div id="list"></div>
</div>
<div id="viewer"><button id="close">✕</button><div class="inner" id="mdview"></div></div>
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/dompurify@3/dist/purify.min.js"></script>
<script>
let MANIFEST = [];
const chipState = new Set();
fetch('manifest.json').then(r => r.json()).then(m => {
  MANIFEST = m;
  MANIFEST.sort((a,b) => b.date.localeCompare(a.date));
  const channels = [...new Set(MANIFEST.map(x => x.channel))].sort();
  const chips = document.getElementById('chips');
  for (const ch of channels) {
    const c = document.createElement('span'); c.className = 'chip'; c.textContent = ch;
    c.onclick = () => { c.classList.toggle('on'); chipState.has(ch) ? chipState.delete(ch) : chipState.add(ch); render(); };
    chips.appendChild(c);
  }
  render();
});
function render() {
  const byDay = {};
  for (const m of MANIFEST) {
    if (chipState.size && !chipState.has(m.channel)) continue;
    (byDay[m.date] = byDay[m.date] || []).push(m);
  }
  const list = document.getElementById('list');
  list.innerHTML = '';
  document.getElementById('count').textContent = Object.values(byDay).flat().length + ' drafts';
  for (const date of Object.keys(byDay).sort().reverse()) {
    const day = document.createElement('div'); day.className = 'day';
    day.innerHTML = `<div class="date">${date}</div>`;
    const cards = document.createElement('div'); cards.className = 'cards';
    for (const m of byDay[date]) {
      const c = document.createElement('div'); c.className = 'card';
      c.innerHTML = `<div class="ch">${m.channel.replace(/-/g,' ')}</div><div class="words">view draft →</div>`;
      c.onclick = () => openDraft(m);
      cards.appendChild(c);
    }
    day.appendChild(cards); list.appendChild(day);
  }
}
async function openDraft(m) {
  const v = document.getElementById('viewer');
  v.classList.add('open');
  document.getElementById('mdview').innerHTML = '<p style="color:#6d7687">loading…</p>';
  const res = await fetch(m.file);
  const raw = await res.text();
  document.getElementById('mdview').innerHTML = DOMPurify.sanitize(marked.parse(raw));
}
document.getElementById('close').onclick = () => document.getElementById('viewer').classList.remove('open');
</script>
</body>
</html>
